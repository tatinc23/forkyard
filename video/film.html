<html lang="en"><head><meta charset="utf-8">

<style>
@import url('fonts/fonts.css');
html,body{margin:0;background:#FBF7F0}
canvas{display:block;width:1920px;height:1080px}

body.fit canvas{width:100vw;height:auto;aspect-ratio:16/9}

body.fit #hud{display:block}

<div id="hud">space: play / pause · left/right: scrub 1s · R: reduced-motion · C: captions</div>
